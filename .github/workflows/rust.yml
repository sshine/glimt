name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, 2026-07-16

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35, 2026-06-17
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # The key formula is shared with the release workflow, down to which files it
      # hashes: the two build the same per-crate derivations, and a tag push restores
      # what the push to main left behind only if both spell the key the same way.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2, 2026-01-30
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # 4.4 GiB is what the flake check and the dev shell need together, measured with
          # `nix path-info` over the union closure: the toolchain, GTK, Wayland and the
          # five hundred per-crate outputs. A 2G budget evicted more than half of that
          # before the cache was written, so every run recompiled what the last one built.
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # Formatting, clippy, the tests, both frontends, the client and the NixOS module,
      # in one pass over one set of per-crate derivations. Running clippy and the tests
      # through cargo in the dev shell instead would compile the workspace twice more,
      # into a target/ directory nothing caches between runs.
      - name: Flake check
        run: nix flake check -L

      - name: Verify Cargo.lock and Cargo.nix
        run: nix develop -c just lock-check crate2nix-check
