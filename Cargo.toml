[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/glimt"
homepage = "https://github.com/sshine/glimt"

# Versions live here and the crates inherit them; feature sets stay with the crate that
# needs them, since those are what differ between members.
[workspace.dependencies]
glimt-cal = { version = "0.2.1", path = "crates/glimt-cal" }
glimt-proto = { version = "0.2.1", path = "crates/glimt-proto" }
glimt-shell = { version = "0.2.1", path = "crates/glimt-shell" }
napkin-math = { version = "0.2.1", path = "crates/napkin-math" }

anyhow = "1.0"
async-channel = "2"
chrono = { version = "0.4", default-features = false }
clap = "4.5"
libc = "0.2"
roxmltree = "0.21"
scheme-rs = "0.2"
serde = { version = "1.0", default-features = false }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
zbus = "5"

# Candidate A
gdk4 = "0.11"
glib = "0.22"
gtk4 = "0.11"
gtk4-layer-shell = "0.8"

# Candidate B
cosmic-text = "0.19"
smithay-client-toolkit = "0.21"
tiny-skia = "0.12"
wayland-client = "0.31"
wayland-protocols = "0.32"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
